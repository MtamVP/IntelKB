<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>IntelKB · Workbench</title><link rel="stylesheet" href="../web/dist/style.css"><link rel="stylesheet" href="../web/dist/dictionary.css"><link rel="stylesheet" href="../web/dist/community.css"></head><body>
<header class="nav"><a class="brand" href="../">IntelKB <span class="beta">WORKBENCH</span></a><span class="beta">PRIVATE ACCESS</span></header>
<main class="admin-shell"><div class="eyebrow">NỘI DUNG RÕ NGHĨA. QUYỀN DUYỆT RÕ RÀNG.</div><h1>Trước khi thành lời.</h1><p class="admin-subtitle">Kiểm tra nghĩa, ví dụ và thông điệp trước khi công bố cho cộng đồng.</p>
<form id="admin-login" class="admin-login"><h2>Đăng nhập quản trị</h2><label>Email<input id="admin-email" type="email" autocomplete="username" required></label><label>Mật khẩu<input id="admin-password" type="password" autocomplete="current-password" required></label><button id="login-button" type="submit">Đăng nhập</button><p class="admin-subtitle">Chỉ tài khoản đã được cấp quyền trong Supabase mới xem được hàng chờ.</p></form>
<p id="admin-status" class="admin-message" role="status" aria-live="polite"></p>
<section id="admin-panel" hidden><div class="admin-controls"><select id="queue-kind" aria-label="Loại hàng chờ"><option value="proposals">Đóng góp cộng đồng</option><option value="seeds">Bộ từ khởi tạo</option></select><select id="queue-filter" aria-label="Trạng thái"><option value="pending">Chờ duyệt</option><option value="accepted">Đã chấp nhận</option><option value="rejected">Đã từ chối</option></select><button id="queue-reload">Tải lại</button><button id="admin-logout">Đăng xuất</button></div><p class="admin-subtitle" id="queue-description"></p><div id="queue-list"></div><div class="catalogue-pager"><button id="queue-prev">← Trước</button><span id="queue-page"></span><button id="queue-next">Sau →</button></div>
<form id="review-form" class="admin-review review-panel" hidden><h2>Kiểm tra đề xuất</h2><div class="review-original" id="review-original"></div><div class="queue-grid"><label>Nghĩa sẽ công bố<input id="review-expansion" maxlength="240" required></label><label>Nhóm từ<select id="review-category"><option value="chat">Nhắn tin</option><option value="profanity">Từ tục</option><option value="euphemism">Nói nhẹ</option><option value="english">Tiếng Anh</option><option value="game">Game</option></select></label></div><label class="check-label"><input id="review-auto" type="checkbox"> Cho phép tự bung khi rõ một nghĩa</label><label>Ghi chú quyết định<textarea id="review-note" rows="2" maxlength="1000" placeholder="Lý do chấp nhận hoặc từ chối"></textarea></label><button id="accept-proposal" type="submit">Accept · Công bố</button><button id="reject-proposal" type="button" class="reject">Reject · Từ chối</button><button id="cancel-review" type="button" class="cancel">Đóng</button></form></section></main><script type="module" src="../web/dist/admin.mjs"></script></body></html>
